name: Release DEB

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to use for the release (must include the v prefix, e.g., v1.2.3)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  publish-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Configure PGP key
        shell: bash
        run: |
          base64 -di <<< "$GPG_SIGNING_KEY" | gpg --import
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}

      - name: Release
        env:
          GPG_SIGNING_EMAIL: ${{ secrets.GPG_SIGNING_EMAIL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -x
          codename=$(lsb_release -sc 2>/dev/null)
          deb_arch=$(dpkg --print-architecture)

          # Download latest release
          gh release download         \
            ${{ inputs.tag }}         \
            --dir deb_repo            \
            --repo nibrobb/luxafor-ui \
            --pattern '*.deb'

          # Download existing files in debian repo
          gh release download         \
            debian                    \
            --dir deb_repo            \
            --repo nibrobb/luxafor-ui \
            --clobber                 \
            --pattern '*.deb'

          cd deb_repo
          dpkg-scanpackages --multiversion ./ > Packages
          gzip -kf Packages

          apt-ftparchive release ./ > Release

          gpg --default-key "$GPG_SIGNING_EMAIL" --yes --armor --detach-sign --sign -o Release.gpg Release
          gpg --default-key "$GPG_SIGNING_EMAIL" --yes --clearsign -o InRelease Release

          mkdir -v artifacts
          cp -v                                       \
            ../debian/luxafor-ui-archive-keyring.asc  \
            ./*.deb                                   \
            Release                                   \
            Release.gpg                               \
            InRelease                                 \
            Packages                                  \
            Packages.gz                               \
            artifacts/
          gh release upload debian ./artifacts/* --clobber --repo nibrobb/luxafor-ui
