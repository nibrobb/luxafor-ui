name: 'Build and publish bundles'

on:
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-latest'
            rust_target: x86_64-unknown-linux-gnu
          - platform: 'windows-latest'
            rust_target: x86_64-pc-windows-msvc
          - platform: 'macos-26'
            rust_target: aarch64-apple-darwin
          - platform: 'macos-26-intel'
            rust_target: x86_64-apple-darwin
    
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

#      - name: Cache Rust
#        uses: Swatinem/rust-cache@v2.8.2
#        with:
#          key: luxafor-ui-tauri-${{ matrix.platform }}-${{ matrix.rust_target }}
#          shared-key: deps-tauri-${{ matrix.rust_target }}
#          cache-on-failure: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, ${{ matrix.rust_target }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.16.2

      - name: Install binaries
        run: cargo binstall -y tauri-cli@2 trunk wasm-bindgen-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libudev-dev libayatana-appindicator3-dev
        
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: 'Luxafor-ui v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          assetNamePattern: '[name]-[version]-${{ matrix.rust_target }}[ext]'
          prerelease: true
          args: '--target ${{ matrix.rust_target }}'
